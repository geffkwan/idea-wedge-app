<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vouch Ledger</title>
<meta name="description" content="Vouch Ledger — the product. Candidate, voucher and company workspaces, plus the public record a hiring manager reads." />
<link rel="stylesheet" href="../design/tokens.css">
<style>
/* =====================================================================
   Page-specific CSS. Only what tokens.css does not cover: the app shell,
   rail, record entries, engagement steps, flows. Tokens only, no new hex.
   ===================================================================== */
body{ background:var(--ground); font-size:14px }
.tiny{ font-size:11.5px }
.r{ text-align:right }
.b6{ font-weight:600 }
.mt4{ margin-top:4px } .mt8{ margin-top:8px } .mt12{ margin-top:12px } .mt16{ margin-top:16px }
.ul{ margin:0; padding-left:16px; font-size:13px; color:var(--text-2); line-height:1.7 }
.ul li+li{ margin-top:2px }
.nowrap{ white-space:nowrap }
.rid{ font-family:var(--font-mono); font-size:11px; color:var(--muted); letter-spacing:.02em; white-space:nowrap }
.sub{ font-size:12.5px; color:var(--text-2) }
.box-head h3{ font-size:14px; text-transform:uppercase; font-stretch:110; letter-spacing:.01em }
.box-body > * + *{ margin-top:12px }
.box-body.flush{ padding:0 }

/* ---- shell ---- */
.topbar{ position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:var(--bw) solid var(--line) }
.topbar-in{ max-width:var(--max); margin:0 auto; padding:0 var(--gutter); display:flex; align-items:center; gap:14px; min-height:56px }
.wordmark{ display:inline-flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:900; font-stretch:var(--wdth-display); text-transform:uppercase; letter-spacing:-.02em; font-size:15px; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-decoration:none; white-space:nowrap }
.blk{ width:30px; height:30px; background:var(--ink); color:var(--butter); display:grid; place-items:center; font-family:var(--font-mono); font-size:11px; font-weight:700; flex:none; letter-spacing:0 }
.ws{ display:flex; align-items:center; gap:8px; padding-left:14px; border-left:var(--bw) solid var(--line); font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; min-height:28px; min-width:0 }
.ws .avatar{ width:24px; height:24px; font-size:9px }
.top-r{ margin-left:auto; display:flex; gap:8px; align-items:center; position:relative }
.iconbtn{ width:36px; height:36px; display:grid; place-items:center; border:var(--bw) solid var(--line); background:var(--surface); position:relative; padding:0 }
.iconbtn:hover{ background:var(--butter) }
.iconbtn.on{ background:var(--ink); color:var(--bone) }
.iconbtn .cnt{ position:absolute; top:-8px; right:-8px; background:var(--signal); color:var(--paper); font-family:var(--font-mono); font-size:10px; font-weight:700; min-width:18px; height:18px; display:grid; place-items:center; border:var(--bw) solid var(--ink); padding:0 3px; line-height:1 }
.pop{ position:absolute; right:0; top:calc(100% + 10px); width:min(380px,calc(100vw - 32px)); background:var(--surface); border:var(--bw) solid var(--line); box-shadow:var(--shadow); z-index:40; text-align:left }
.pop .ph{ display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:var(--bw) solid var(--line); background:var(--lilac) }
.pop .it{ display:flex; gap:10px; padding:10px 12px; border:0; border-bottom:1px solid var(--line-soft); font-size:13px; align-items:flex-start; width:100%; text-align:left; background:transparent; font-family:inherit; line-height:1.4 }
.pop .it:last-child{ border-bottom:0 }
.pop .it:hover{ background:var(--butter) }
.pop .it.unread{ background:color-mix(in srgb, var(--lilac) 40%, transparent) }
.pop .it .dot{ width:8px; height:8px; background:var(--signal); flex:none; margin-top:6px }
.pop .it.read .dot{ background:var(--line-soft) }
.pop .it .when{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); margin-top:3px }
.pop.menu button{ display:flex; gap:10px; align-items:center; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line-soft); padding:11px 14px; font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:700 }
.pop.menu button:last-child{ border-bottom:0 }
.pop.menu button:hover{ background:var(--butter) }
.pop.menu .who{ padding:12px 14px; border-bottom:var(--bw) solid var(--line); display:flex; gap:10px; align-items:center }
.app{ max-width:var(--max); margin:0 auto; padding:20px var(--gutter) 110px; display:grid; grid-template-columns:200px minmax(0,1fr); gap:28px; align-items:start }
.rail{ position:sticky; top:76px; display:flex; flex-direction:column; border:var(--bw) solid var(--line); background:var(--surface) }
.rail button{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line-soft); padding:11px 12px; font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text) }
.rail button:hover{ background:var(--butter) }
.rail button .idx{ color:var(--signal); font-weight:500 }
.rail button.on{ background:var(--ink); color:var(--bone) }
.rail button.on .idx{ color:var(--butter) }
.rail button .tag{ margin-left:auto; padding:1px 5px; font-size:9.5px }
.rail button.on .tag{ background:var(--butter); color:var(--ink); border-color:var(--butter) }
.rail-foot{ padding:10px 12px; font-size:12px; color:var(--muted); line-height:1.45 }
main{ min-width:0; display:flex; flex-direction:column; gap:20px }
.phead{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-bottom:16px; border-bottom:var(--bw) solid var(--line) }
.phead h1{ font-size:clamp(28px,3.4vw,44px); margin-top:8px }
.phead p{ max-width:64ch; color:var(--text-2); margin-top:8px }
.phead .act{ display:flex; gap:10px; flex-wrap:wrap }
.split{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:20px; align-items:start }
.split.even{ grid-template-columns:minmax(0,1fr) minmax(0,1fr) }
.col{ display:flex; flex-direction:column; gap:20px; min-width:0 }
.kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--bw); background:var(--line); border:var(--bw) solid var(--line) }
.kpis > .kpi{ background:var(--surface); padding:14px 16px }
.kpis.k3{ grid-template-columns:repeat(3,minmax(0,1fr)) }
.kpi .v small{ font-family:var(--font-mono); font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0 }
@media (max-width:1000px){ .split,.split.even{ grid-template-columns:minmax(0,1fr) } }
@media (max-width:900px){ .kpis,.kpis.k3{ grid-template-columns:repeat(2,minmax(0,1fr)) } }
@media (max-width:860px){
  .app{ grid-template-columns:1fr; gap:16px; padding-bottom:130px }
  .rail{ position:static; flex-direction:row; overflow-x:auto; scrollbar-width:none }
  .rail::-webkit-scrollbar{ display:none }
  .rail button{ white-space:nowrap; width:auto; border-bottom:0; border-right:1px solid var(--line-soft) }
  .rail-foot{ display:none }
  .ws .nm,.ws .tag{ display:none }
  .topbar-in{ gap:10px }
  .pubbar .top-r{ gap:10px !important; flex-wrap:wrap; justify-content:flex-end }
  .pubbar .lnk{ font-size:10px; white-space:nowrap }
}
@media (max-width:480px){ .kpis,.kpis.k3{ grid-template-columns:1fr } .phead .act .btn{ flex:1 } .pubbar .wordmark{ font-size:0 } }

/* ---- identity ---- */
.vbs{ display:inline-flex; gap:3px }
.vb{ display:inline-grid; place-items:center; height:18px; min-width:22px; padding:0 4px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:.04em; border:1.5px solid var(--line); background:var(--butter); color:var(--ink); line-height:1 }
.vb.off{ background:transparent; border-style:dashed; color:var(--muted) }
.tiers{ display:flex; flex-direction:column; gap:6px }
.tier{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 10px; border:var(--bw) solid var(--line); font-size:13px }
.tier.ok{ background:var(--butter) }
.tier .mono{ font-size:11px }
.pc{ display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); padding:2px 8px 2px 2px; font-size:12px; background:var(--surface) }
.pc .avatar{ width:20px; height:20px; font-size:8px; border-width:1.5px }
.pc.pend{ border-style:dashed; color:var(--muted) }

/* ---- record entries ---- */
.ent{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 16px; padding:14px 0; border-bottom:1px solid var(--line-soft) }
.ent:last-child{ border-bottom:0; padding-bottom:0 }
.ent:first-child{ padding-top:0 }
.ent .t{ font-weight:600; font-size:14.5px; line-height:1.3; margin-top:8px }
.ent .m{ font-size:12.5px; color:var(--text-2); margin-top:3px }
.ent .acts{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px }
.ent .side{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; text-align:right }
.ent.new{ animation:flash .9s steps(3,end) }
@keyframes flash{ 0%{ background:var(--butter) } 100%{ background:transparent } }
@media (max-width:640px){ .ent{ grid-template-columns:1fr } .ent .side{ flex-direction:row; align-items:center; text-align:left } }

/* ---- strength ---- */
.gauge{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:16px; align-items:center }
.gauge .big{ font-size:60px }
.bd{ display:grid; gap:8px }
.bd .b{ display:grid; grid-template-columns:minmax(0,1fr) 100px 32px; gap:10px; align-items:center; font-size:12.5px }
.bd .b .bar{ height:10px }

/* ---- listings / engagements ---- */
.hd{ display:flex; gap:10px; align-items:center; flex-wrap:nowrap; min-width:0 }
.hd > div{ min-width:0; flex:1 }
.hd b{ display:block; line-height:1.3 }
.nba{ white-space:normal; text-align:left; justify-content:space-between; text-transform:none; letter-spacing:0; font-family:var(--font-body); font-weight:600; padding:10px 12px }
.nba > span:first-child{ flex:1; min-width:0 }
.field .rc label,.field .check{ font-family:var(--font-body); text-transform:none; letter-spacing:0; font-weight:400; font-size:13.5px }
.lst{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:start }
.lst .pay{ font-family:var(--font-display); font-weight:900; font-stretch:110; font-size:26px; letter-spacing:-.02em; text-align:right; line-height:1 }
.lst .pay small{ display:block; font-family:var(--font-mono); font-size:10px; color:var(--muted); font-weight:500; margin-top:4px; letter-spacing:.04em; text-transform:uppercase }
.lst .meta{ display:flex; gap:6px 14px; flex-wrap:wrap; font-family:var(--font-mono); font-size:10.5px; color:var(--text-2); margin-top:8px; text-transform:uppercase; letter-spacing:.04em }
.lst .side{ display:flex; flex-direction:column; align-items:flex-end; gap:10px }
@media (max-width:560px){ .lst{ grid-template-columns:1fr } .lst .side{ align-items:flex-start } .lst .pay{ text-align:left } }
.sqlogo{ width:36px; height:36px; display:grid; place-items:center; border:var(--bw) solid var(--line); font-family:var(--font-display); font-weight:900; font-size:15px; flex:none; background:var(--bone) }
.sqlogo.ink{ background:var(--ink); color:var(--bone) } .sqlogo.lilac{ background:var(--lilac) } .sqlogo.butter{ background:var(--butter) } .sqlogo.plum{ background:var(--plum); color:var(--paper) } .sqlogo.navy{ background:var(--navy); color:var(--paper) }
.steps{ display:flex; flex-direction:column; border:var(--bw) solid var(--line) }
.steps .st{ display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line-soft); font-size:13.5px; flex-wrap:wrap }
.steps .st:last-child{ border-bottom:0 }
.steps .st .idx{ font-size:11px; color:var(--signal) }
.steps .st.done{ background:var(--butter) } .steps .st.done .idx{ color:var(--ink) }
.steps .st.done .tx{ text-decoration:line-through; color:var(--text-2) }
.steps .st .btn,.steps .st .tag{ margin-left:auto }
.steps .st.lock{ color:var(--muted) }
.slots{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px }
.slot{ border:var(--bw) solid var(--line); background:var(--surface); padding:10px; font-family:var(--font-mono); font-size:11px; text-align:left; line-height:1.4; letter-spacing:.02em }
.slot.on{ background:var(--ink); color:var(--bone) }
.slot b{ display:block; font-size:12.5px }
.eng + .eng{ border-top:var(--bw) dashed var(--line); padding-top:14px }

/* ---- checklist ---- */
.ck{ border-top:1px solid var(--line-soft); padding:12px 0 }
.ck:first-of-type{ border-top:0; padding-top:0 }
.ck:last-child{ padding-bottom:0 }
.ck .hd{ display:flex; gap:10px; align-items:center; flex-wrap:wrap }
.ck .n{ width:22px; height:22px; border:var(--bw) solid var(--line); display:grid; place-items:center; font-family:var(--font-mono); font-size:10.5px; font-weight:700; flex:none }
.ck.done .n{ background:var(--ink); color:var(--butter) }
.ck.done .hd b{ text-decoration:line-through; color:var(--muted); font-weight:500 }
.ck .bd2{ margin:10px 0 0 32px; display:flex; flex-direction:column; gap:8px }
.ck .cl{ display:flex; align-items:center; gap:10px; padding:8px 10px; border:1.5px solid var(--line-soft); font-size:13px; flex-wrap:wrap }
.ck .cl .btn,.ck .cl .st{ margin-left:auto }
@media (max-width:560px){ .ck .bd2{ margin-left:0 } }

/* ---- stepper / tabs / radio cards ---- */
.stepper{ display:flex; border:var(--bw) solid var(--line); font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; overflow-x:auto; scrollbar-width:none }
.stepper span{ padding:8px 12px; border-right:1px solid var(--line-soft); white-space:nowrap; color:var(--muted); display:flex; align-items:center; gap:6px; flex:1 }
.stepper span:last-child{ border-right:0 }
.stepper span.cur{ background:var(--ink); color:var(--bone) }
.stepper span.done{ background:var(--butter); color:var(--ink) }
.stepper span .idx{ font-weight:700 }
.stepper span.cur .idx{ color:var(--butter) }
.tabs{ display:flex; border-bottom:var(--bw) solid var(--line); overflow-x:auto; scrollbar-width:none }
.tabs button{ background:transparent; border:0; border-bottom:3px solid transparent; margin-bottom:-2px; padding:10px 14px; font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap }
.tabs button.on{ color:var(--text); border-bottom-color:var(--signal) }
.rc{ display:flex; flex-direction:column; gap:6px }
.rc label{ display:flex; gap:10px; align-items:flex-start; border:var(--bw) solid var(--line); padding:10px 12px; cursor:pointer; font-size:13.5px; background:var(--surface) }
.rc label:has(input:checked){ background:var(--lilac) }
.rc input{ margin-top:3px; width:auto; flex:none; accent-color:var(--ink) }
.rc label > span{ flex:1; min-width:0 }
.rc.grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)) }
@media (max-width:640px){ .rc.grid2{ grid-template-columns:1fr } }

/* ---- company ---- */
.funnel{ display:grid; gap:8px }
.funnel .f{ display:grid; grid-template-columns:120px minmax(0,1fr) 40px; gap:10px; align-items:center; font-size:12.5px }
.funnel .f .bar{ height:14px }
.quote{ border-left:var(--bw-heavy) solid var(--ink); padding:4px 12px; font-size:13.5px; color:var(--text-2) }
.quote .by{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.04em }
.pgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px }
.pcard{ display:flex; flex-direction:column; gap:10px }
.pcard .hd{ display:flex; gap:10px; align-items:center }
.pcard .sk{ display:flex; gap:4px; flex-wrap:wrap }
.pcard .stats{ display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-family:var(--font-mono); font-size:10.5px; color:var(--text-2); text-transform:uppercase; letter-spacing:.04em }
.pcard .stats b{ color:var(--text) }
.queue .q{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line-soft) }
.queue .q:first-child{ padding-top:0 } .queue .q:last-child{ border-bottom:0; padding-bottom:0 }
.camp{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center }
@media (max-width:560px){ .camp{ grid-template-columns:1fr } .queue .q{ grid-template-columns:1fr } }

/* ---- misc components ---- */
.linkbox{ display:flex; gap:8px; align-items:center; border:var(--bw) solid var(--line); background:var(--bone); padding:6px 6px 6px 12px; font-family:var(--font-mono); font-size:12px; overflow:hidden }
.linkbox span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0 }
.empty{ border:var(--bw) dashed var(--line); padding:22px; text-align:center; font-size:13px; color:var(--text-2) }
.term.sm{ font-size:11.5px; padding:10px 12px; line-height:1.6 }
.term .warn{ color:var(--lilac) }
pre.json{ margin:0; max-height:46vh; overflow:auto; font-size:11.5px }
.hist td:first-child{ white-space:nowrap }
.plus{ color:var(--ink); font-weight:700 } .minus{ color:var(--signal); font-weight:700 }
.resume{ background:var(--surface); border:var(--bw) solid var(--line); padding:22px 24px; position:relative; font-size:12.5px; line-height:1.5; color:var(--text-2); overflow:hidden }
.resume h4{ font-family:var(--font-display); font-size:20px; color:var(--text); text-transform:uppercase; font-stretch:110 }
.resume .l{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:14px 0 4px }
.resume .claim{ padding:5px 8px; margin:2px -8px; display:flex; gap:8px; align-items:flex-start }
.resume .claim.v{ background:var(--butter) }
.resume .claim .st{ flex:none; font-family:var(--font-mono); font-size:9.5px; font-weight:700; margin-top:3px; min-width:26px }
.resume .stampmark{ position:absolute; right:18px; top:14px }
.resume .foot{ margin-top:18px; padding-top:10px; border-top:var(--bw) dashed var(--line); font-family:var(--font-mono); font-size:10.5px; color:var(--muted); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center }
.qr{ width:44px; height:44px; flex:none }
@keyframes stampin{ 0%{ transform:scale(1.6) rotate(-14deg); opacity:0 } 100%{ transform:scale(1) rotate(-4deg); opacity:1 } }
.stamp.in{ animation:stampin .25s steps(3,end) both }

/* ---- public chrome ---- */
.pubbar{ background:var(--ink); color:var(--bone); position:sticky; top:0; z-index:30 }
.pubbar .topbar-in{ min-height:52px }
.pubbar .blk{ background:var(--butter); color:var(--ink) }
.pubbar .url{ font-family:var(--font-mono); font-size:12px; color:var(--butter); padding-left:14px; border-left:var(--bw) solid var(--bone); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0 }
.pubbar .lnk{ background:none; border:0; color:var(--bone); font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; padding:6px 0; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:4px }
.pubbar .lnk.on{ color:var(--butter) }
.pub{ max-width:1100px; margin:0 auto; padding:24px var(--gutter) 110px; display:flex; flex-direction:column; gap:20px }
.pubhead{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center }
.pubhead h1{ font-size:clamp(26px,3vw,40px) }
@media (max-width:700px){ .pubhead{ grid-template-columns:auto minmax(0,1fr) } .pubhead .act{ grid-column:1/-1 } .pubbar .url{ display:none } }

/* ---- sign-in ---- */
.signin{ min-height:100vh; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) }
.signin .lft{ padding:40px; display:flex; flex-direction:column; justify-content:space-between; gap:40px }
.signin .lft h1{ font-size:clamp(40px,5vw,76px); color:var(--bone); margin-top:18px }
.signin .lft .lead{ color:var(--text-2) }
.signin .rgt{ display:grid; place-items:center; padding:40px 16px }
.signin .form{ width:min(440px,100%) }
.sso{ display:flex; gap:10px; align-items:center }
.sso .g{ width:22px; height:22px; border:1.5px solid currentColor; display:grid; place-items:center; font-size:10px; letter-spacing:0 }
.or{ display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted) }
.or::before,.or::after{ content:""; flex:1; border-top:1px dashed var(--line) }
.accts{ display:grid; gap:6px }
.accts button{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--surface); border:var(--bw) solid var(--line); padding:8px 10px; font-size:13px }
.accts button:hover{ background:var(--butter) }
.accts button .tag{ margin-left:auto }
@media (max-width:900px){ .signin{ grid-template-columns:1fr } .signin .lft{ padding:28px 16px; gap:20px } .signin .lft h1{ font-size:40px } .signin .rgt{ padding:24px 16px 130px } }

/* ---- prototype controls ---- */

  const out=[];

  if(pend)out.push([`Get ${S.vouchers[(pend.pendingFrom||[])[0]]?.name.split(' ')[0]||'a second person'} to vouch`,'+'+(pend.weight)+' · takes the claim to full weight','vouches']);
  const un=S.ledger.find(e=>e.kind==='claim'&&(e.status==='unvouched'||e.status==='revoked'));

  accept:id=>{const o=oppOf(id);if(!o)return;if(typeOf(o).slot){UI.slot=0;slotModal(o);}else startEng(o,null);},
  slot:i=>{UI.slot=Number(i);const b=document.querySelector('[data-act="bookslot"]');document.querySelectorAll('.slot').forEach((el,j)=>el.classList.toggle('on',j===UI.slot));if(b){const [id]=b.dataset.arg.split(':');b.dataset.arg=id+':'+document.querySelectorAll('.slot b')[UI.slot].textContent;}},
  bookslot:arg=>{const i=arg.indexOf(':');startEng(oppOf(arg.slice(0,i)),arg.slice(i+1));},
  step:arg=>{const [id,i]=arg.split(':');const e=S.eng.find(x=>x.id===id);const n=oppOf(e.oppId).steps.length;if(Number(i)<n-1){set(s=>{e.progress[Number(i)]=true;});toast('Step recorded');}else completeEng(e);},
  confirm:id=>confirmEng(id),
  convert:id=>set(s=>{const e=s.eng.find(x=>x.id===id);e.converted=true;const cp=campOf(oppOf(e.oppId));if(cp){cp.converted+=1;const f=cp.funnel.find(x=>x[0]==='Became customers');if(f)f[1]+=1;}notify('company',`${engName(e)} marked as converted.`,'campaigns');}),
  opencamp:id=>{if(!id)return;set(s=>{s.openCampaign=id;s.campTab=s.campTab||'overview';s.view.company='campaigns';});setTimeout(()=>document.getElementById('campdetail')?.scrollIntoView({behavior:'smooth',block:'start'}),30);},
  closecamp:()=>set(s=>{s.openCampaign=null;}),
  camptab:t=>set(s=>{s.campTab=t;}),
  campstatus:arg=>{const [id,st]=arg.split(':');set(s=>{const c=s.campaigns.find(x=>x.id===id);c.status=st;const o=s.opps.find(x=>x.id===c.oppId);if(o)o.state=st==='live'?'open':st;if(st==='closed'){const unused=c.seats-c.completed;s.company.seatsUsed=Math.max(0,s.company.seatsUsed-Math.max(0,unused));c.closed=NOW.toISOString();}});toast(st==='live'?'Campaign resumed':st==='paused'?'Campaign paused · listing hidden':'Campaign closed · unused seats returned');},
  launch:id=>{const c=S.campaigns.find(x=>x.id===id);launchCampaignFrom({type:c.type,title:c.title,desc:c.desc||'',needs:c.needs||'Product design',issue:c.issues.length>1?'Task attestation + skill':'Task attestation',skill:(c.issues[1]||'').replace(/^Skill:\s*/,''),pay:c.pay,seats:c.seats});set(s=>{s.campaigns=s.campaigns.filter(x=>x.id!==id);});},
  cstep:n=>{readDraft();set(s=>{s.draft.step=Number(n);});window.scrollTo({top:0});},
  cdiscard:()=>set(s=>{s.draft=null;s.view.company='campaigns';}),
  clauncher:()=>{readDraft();if(!S.draft.title.trim()){toast('Give the campaign a title first');set(s=>{s.draft.step=2;});return;}launchCampaignFrom(S.draft);},
  invite:tid=>{const live=S.campaigns.filter(c=>c.status==='live');modal(`${mhead('Invite to campaign','Pool')}<div class="modal-body stack" style="gap:12px"><p class="sub">They see the task, the payout and the attestation you will issue. You see their name once they accept.</p><div class="rc">${live.map((c,i)=>`<label><input type="radio" name="invC" value="${c.id}" ${i===0?'checked':''}><span><b>${esc(c.title)}</b><div class="tiny muted">${money(c.pay)} · ${c.seats-c.completed} seats open</div></span></label>`).join('')||'<div class="empty">No live campaign. Launch one first.</div>'}</div></div><div class="modal-foot"><button class="btn flat" data-close="1">Cancel</button><button class="btn primary" ${a('doinvite',tid)} ${live.length?'':'disabled'}>Send invite</button></div>`,{narrow:true,label:'Invite to campaign'});},
  doinvite:tid=>{const cid=(document.querySelector('input[name="invC"]:checked')||{}).value;const c=S.campaigns.find(x=>x.id===cid);if(!c)return;closeModal();set(s=>{const who=tid==='t4'?'alex':tid;if(s.eng.some(e=>e.oppId===c.oppId&&e.who===who))return;s.eng.unshift({id:uid(),oppId:c.oppId,who,state:'invited',progress:oppOf(c.oppId).steps.map(()=>false),invitedAt:NOW.toISOString()});const f=c.funnel.find(x=>x[0]==='Invited');if(f)f[1]+=1;if(who==='alex')notify('candidate',`Relay Analytics invited you to "${c.title}" · ${money(c.pay)}.`,'tasks');});toast('Invite sent. They stay anonymous to you until they accept.');},
  changeplan:()=>modal(`${mhead('Change plan','Billing')}<div class="modal-body"><div class="grid g3" style="gap:12px">${Object.entries(PLANS).map(([k,p])=>`<div class="box tight stack ${k===S.company.plan?'butter':''}" style="gap:8px"><span class="lbl">${p.name}</span><div class="hero-num" style="font-size:30px">${money(p.price)}</div><div class="tiny muted">${p.seats} seats / month · ${p.blurb}</div><button class="btn sm ${k===S.company.plan?'flat':'primary'}" ${k===S.company.plan?'disabled':a('plan',k)}>${k===S.company.plan?'Current':'Switch'}</button></div>`).join('')}</div><p class="tiny muted mt12">Changes prorate today. Seats already reserved by live campaigns carry over.</p></div>`,{label:'Change plan'}),
  plan:k=>{closeModal();set(s=>{s.company.plan=k;s.company.seatsTotal=PLANS[k].seats;});toast(`Switched to ${PLANS[k].name}. Prorated today.`);},
  withdraw:()=>{const amt=available();if(amt<=0)return;modal(`${mhead('Withdraw','Wallet')}<div class="modal-body stack" style="gap:12px"><div class="term"><span class="p">></span> <span class="k">amount</span>   <span class="v">${money2(amt)}</span>
<span class="p">></span> <span class="k">to</span>       ${S.candidate.payout}
<span class="p">></span> <span class="k">fee</span>      $0.00 · the 20% was taken on each payout, never on withdrawal
<span class="p">></span> <span class="k">arrives</span>  1–2 business days</div></div><div class="modal-foot"><button class="btn flat" data-close="1">Cancel</button><button class="btn primary" ${a('dowithdraw')}>Withdraw ${money2(amt)}</button></div>`,{narrow:true,label:'Withdraw'});},
  dowithdraw:()=>{const amt=available();closeModal();set(s=>{s.wallet.withdrawn+=amt;s.wallet.history.unshift({date:NOW.toISOString(),amt});notify('candidate',`${money2(amt)} is on its way to ${s.candidate.payout}.`,'wallet');});toast(`${money2(amt)} on its way`);},
  payoutmethod:()=>modal(`${mhead('Payout method','Wallet')}<div class="modal-body stack" style="gap:12px"><div class="grid g2" style="gap:12px"><div class="field"><label for="pmRouting">Routing number</label><input id="pmRouting" type="text" inputmode="numeric" placeholder="111000025"></div><div class="field"><label for="pmAcct">Account number</label><input id="pmAcct" type="text" inputmode="numeric" placeholder="000123456789"></div></div><p class="tiny muted">Held by the payments provider; we store a reference and the last four digits.</p></div><div class="modal-foot"><button class="btn flat" data-close="1">Cancel</button><button class="btn primary" ${a('dopayout')}>Save</button></div>`,{narrow:true,label:'Payout method'}),
  dopayout:()=>{const n=(document.getElementById('pmAcct')||{}).value||'';closeModal();set(s=>{s.candidate.payout='Bank ····'+(n.slice(-4)||'4821');});toast('Payout method saved');},
  verifyid:arg=>{const [who,code]=arg.split(':');verifyIdentity(who,code);},
  idconfirm:arg=>{const [who,code]=arg.split(':');const codeEl=document.getElementById('idCode');if(code==='@'&&codeEl&&!/^\d{6}$/.test(codeEl.value)){toast('Enter the 6-digit code');return;}closeModal();set(s=>{const p=who==='maya'?s.vouchers.maya:s.candidate;if(code==='@'){p.em=true;if(who!=='maya')p.emAt=p.emAt||'Loom';}else p.gov=true;if(who==='maya')s.standingLog.push({date:NOW.toISOString(),what:(code==='@'?'Work email verified · Tier 2':'Government ID verified · Tier 3'),delta:4});if(who==='maya'){s.vouchers.maya.standing=Math.min(100,s.vouchers.maya.standing+4);}});toast(code==='@'?'Work email verified · Tier 2':'Government ID verified · Tier 3');if(S.vflow)renderVouch();},
  vfsend:()=>{S.vflow.emailSent=true;const em=(document.getElementById('vfEmail')||{}).value;if(em)S.vouchers.maya.email=em;save();renderVouch();toast('Code sent to '+S.vouchers.maya.email);},
  vfcode:()=>{const v=(document.getElementById('vfCode')||{}).value||'';if(!/^\d{6}$/.test(v)){toast('Enter the 6-digit code');return;}set(s=>{s.vouchers.maya.em=true;s.vouchers.maya.standing=Math.min(100,s.vouchers.maya.standing+4);s.standingLog.push({date:NOW.toISOString(),what:'Work email verified · Cadence Health · Tier 2',delta:4});});renderVouch();toast('Work email verified · Tier 2');},
  vfstep:n=>{readVflow();S.vflow.step=Number(n);save();renderVouch();},
  openvouch:id=>openVouch(id),
  signvouch:id=>signVouch(id),
  decline:id=>{closeModal();set(s=>{const r=s.requests.find(x=>x.id===id);r.status='declined';r.answered=NOW.toISOString();s.vflow=null;if(r.fromHandle==='alex-rivera'){const e=s.ledger.find(x=>x.id===r.claimId);if(e){e.pendingFrom=(e.pendingFrom||[]).filter(k=>k!==r.to);if(!(e.vouchedBy||[]).length&&!e.pendingFrom.length){e.status='unvouched';e.weight=0;}}notify('candidate',`${s.vouchers[r.to].name} could not confirm "${r.claim.slice(0,40)}…". Only you can see this.`,'vouches');}});toast('Recorded privately. The requester sees "could not confirm" and nothing else.');},
  revoke:id=>{const v=S.voucherLedger.find(x=>x.id===id);modal(`${mhead('Revoke this vouch','Public · dated')}<div class="modal-body stack" style="gap:12px"><div class="b6">${esc(v.title)}</div><div class="field"><label for="rvWhy">Reason <span class="muted">(kept private)</span></label><select id="rvWhy"><option>I no longer stand behind the wording</option><option>I learned something that changes it</option><option>I signed by mistake</option></select></div><div class="note">The original stays on both records with "revoked ${fmtDate(NOW)}" beside it. Your standing drops 2. Nothing is deleted.</div></div><div class="modal-foot"><button class="btn flat" data-close="1">Keep it</button><button class="btn signal" ${a('dorevoke',id)}>Revoke publicly</button></div>`,{narrow:true,label:'Revoke vouch'});},
  dorevoke:id=>revokeVouch(id),
  stampmodal:()=>stampModal(),
  stamp:()=>{const code='VL-8F3A-C21E-'+NOW.getFullYear();set(s=>{s.stamped=true;s.stampCode=code;s.stampCheck=null;notify('candidate',`Resume stamped · ${code}. Anyone can check it at vouch.id/check.`,'record');});stampModal();toast('Stamped · '+code);},
  verify:id=>verifyModal(id),
  export:()=>jsonModal('Record export',{schema:'vouch.record.v1',subject:'vouch.id/m/'+S.candidate.handle,exported_at:NOW.toISOString(),entries:S.ledger.filter(e=>e.status!=='unvouched').map(recordJSON)}),
  exportrec:id=>{const e=findEntry(id);if(e)jsonModal('Record '+e.rec,recordJSON(e));},
  mklink:()=>{const f=(document.getElementById('applyFor')||{}).value.trim();const note=(document.getElementById('applyNote')||{}).value.trim();if(!f){toast('Add the company and role first');return;}const code=f.toLowerCase().replace(/[^a-z]/g,'').slice(0,3)+'-'+hex(3);set(s=>{s.applyLinks.unshift({id:uid(),for:f,code,views:0,created:NOW.toISOString(),note});});copyText('https://vouch.id/m/'+S.candidate.handle+'/'+code);},
  saveprofile:()=>{const g=id=>(document.getElementById(id)||{}).value;set(s=>{const c=s.candidate;c.name=g('sName')||c.name;c.title=g('sTitle')||c.title;c.loc=g('sLoc')||c.loc;c.handle=(g('sHandle')||c.handle).toLowerCase().replace(/[^a-z0-9-]/g,'');c.email=g('sEmail')||c.email;});toast('Profile saved');},
  deleteacct:()=>modal(`${mhead('Delete account','Irreversible after 14 days')}<div class="modal-body stack" style="gap:12px"><p class="sub">Your login, public profile and apply links stop working now. Entries on other people's records that you signed stay, marked as from a deleted account. After 14 days everything else is erased.</p><div class="field"><label for="delConfirm">Type <span class="mono">delete</span> to confirm</label><input id="delConfirm" type="text" autocomplete="off"></div></div><div class="modal-foot"><button class="btn flat" data-close="1">Keep my account</button><button class="btn signal" ${a('dodelete')}>Delete account</button></div>`,{narrow:true,label:'Delete account'}),
  dodelete:()=>{if((document.getElementById('delConfirm')||{}).value!=='delete'){toast('Type "delete" to confirm');return;}closeModal();toast('Deletion scheduled · 14-day grace period (simulated)');},
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');const inPop=e.target.closest('.pop');
  if(!b){if(UI.pop&&!inPop){UI.pop=null;render();}return;}
  const act=b.dataset.act,arg=b.dataset.arg;
  if(UI.pop&&!inPop&&act!=='pop'){UI.pop=null;}
  if(ACTIONS[act])ACTIONS[act](arg,b);
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.rq){S.reqDraft=Object.assign({},S.reqDraft||{});S.reqDraft[t.dataset.rq]=t.value;save();render();if(t.dataset.rq==='who'&&t.value==='other')setTimeout(()=>document.getElementById('rqEmail')?.focus(),20);}
  if(t.dataset.ctype){readDraft();set(s=>{s.draft.type=t.value;s.draft.pay=typeByName(t.value).median;});}
  if(t.dataset.pref){const [who,k]=t.dataset.pref.split(':');(who==='cand'?S.candidate:S.company).notif[k]=t.checked;save();toast('Preference saved');}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.rqtext){S.reqDraft=Object.assign({},S.reqDraft||{});S.reqDraft[t.dataset.rqtext]=t.value;save();}});
document.addEventListener('submit',e=>{
  if(e.target.id==='magicForm'){e.preventDefault();const v=(document.getElementById('siEmail')||{}).value;if(!v){toast('Enter your email');return;}toast(`Magic link sent to ${v}. In the prototype, pick an account below.`);}
  if(e.target.id==='stampForm'){e.preventDefault();checkStamp();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(UI.pop){UI.pop=null;render();}}});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='protoD')UI.proto=e.target.open;},true);
document.getElementById('modalRoot').addEventListener('click',e=>{const bg=e.currentTarget.querySelector('.modal-bg');const c=e.target.closest('[data-close]');if(!c||!bg)return;if(c===bg&&e.target!==bg)return;closeModal();});
window.addEventListener('hashchange',()=>{if(applyHash()){UI.pop=null;render();}});

/* ---------------------------------------------------------------- boot */
(function boot(){
  applyHash();
  if(S.screen==='app'&&!S.account)S.screen='signin';
  render();
})();
</script>
</body>
</html>
