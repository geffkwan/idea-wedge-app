<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Vouch Ledger</title>
<meta name="description" content="Vouch Ledger prototype: a portable, verified career ledger plus a paid product-testing marketplace that funds it." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --ground:#F4F6F2;--surface:#FFFFFF;--surface-2:#EDF1EA;--surface-3:#E3E9E0;
  --ink:#121D2A;--ink-2:#3B4A57;--muted:#66747F;--line:#D5DDD4;--line-2:#C2CDC1;
  --accent:#176B4B;--accent-strong:#0F5238;--accent-soft:#DCEFE3;--accent-ink:#0B3D2A;
  --seal:#B4432B;--seal-soft:#F6E3DD;
  --good:#1F7A48;--good-soft:#DFF3E6;--warn:#9A6A00;--warn-soft:#FBF0CC;--bad:#A83232;--bad-soft:#F9E0E0;--info:#2F5BA8;--info-soft:#E0E9F8;
  --chain:#2C3E50;
  --shadow:0 10px 30px rgba(18,29,42,.08),0 1px 2px rgba(18,29,42,.06);
  --r:14px;--r-sm:9px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1512;--surface:#171F1B;--surface-2:#1E2924;--surface-3:#26332D;
    --ink:#E8EDE8;--ink-2:#B9C4BC;--muted:#8A978F;--line:#2B3731;--line-2:#3A4841;
    --accent:#4CBF8B;--accent-strong:#6DD3A3;--accent-soft:#183A2C;--accent-ink:#BFEBD3;
    --seal:#E0725A;--seal-soft:#3A2420;
    --good:#5BCB8E;--good-soft:#173B29;--warn:#E4B740;--warn-soft:#3A3116;--bad:#E67373;--bad-soft:#3E1F1F;--info:#7FA6EA;--info-soft:#1C2A44;
    --chain:#AEBBC7;
    --shadow:0 10px 30px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1512;--surface:#171F1B;--surface-2:#1E2924;--surface-3:#26332D;
  --ink:#E8EDE8;--ink-2:#B9C4BC;--muted:#8A978F;--line:#2B3731;--line-2:#3A4841;
  --accent:#4CBF8B;--accent-strong:#6DD3A3;--accent-soft:#183A2C;--accent-ink:#BFEBD3;
  --seal:#E0725A;--seal-soft:#3A2420;
  --good:#5BCB8E;--good-soft:#173B29;--warn:#E4B740;--warn-soft:#3A3116;--bad:#E67373;--bad-soft:#3E1F1F;--info:#7FA6EA;--info-soft:#1C2A44;
  --chain:#AEBBC7;
  --shadow:0 10px 30px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,3.2vw,36px);font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-3px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand .mark{width:30px;height:30px}
.brand .tag{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;letter-spacing:.04em}
.roles{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.roles button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-weight:600;font-size:13px;color:var(--ink-2)}
.roles button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.roles button:focus-visible,.btn:focus-visible,.rail button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top-actions{display:flex;gap:8px;align-items:center}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;border:1px solid var(--line)}
.avatar.co{background:var(--info-soft);color:var(--info)}
.layout{max-width:1280px;margin:0 auto;padding:18px 16px 48px;display:grid;grid-template-columns:212px minmax(0,1fr);gap:22px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);align-self:start;display:flex;flex-direction:column;gap:2px}
.rail button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:10px;color:var(--ink-2);font-weight:500}
.rail button:hover{background:var(--surface-2)}
.rail button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--line)}
.rail .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--surface-3);border-radius:999px;padding:1px 7px;color:var(--ink-2)}
.rail .sep{height:1px;background:var(--line);margin:8px 6px}
.rail-note{padding:10px 11px;font-size:12px;color:var(--muted);line-height:1.45}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head p{max-width:62ch;color:var(--ink-2);margin-top:6px}
@media (max-width: 860px){
  .layout{grid-template-columns:1fr;gap:14px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .rail button{white-space:nowrap;width:auto;border:1px solid var(--line);background:var(--surface-2)}
  .rail .sep,.rail-note{display:none}
  .roles{margin-left:0;width:100%;overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
  .roles::-webkit-scrollbar{display:none}
  .roles button{flex:none;padding:6px 10px;font-size:12.5px}
  .who .name{display:none}
  .page-head .kpi{align-items:flex-start!important;text-align:left!important}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{box-shadow:none}
.card.tight{padding:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.g3,.g2,.g4{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 13px;font-weight:600;font-size:13.5px;line-height:1.2;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-strong)}
:root[data-theme="dark"] .btn.primary,:root:not([data-theme="light"]) .btn.primary{color:#07130D}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
:root[data-theme="light"] .btn.primary{color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;letter-spacing:.01em;line-height:1.6;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--surface-3);color:var(--ink-2)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill.seal{background:var(--seal-soft);color:var(--seal)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--good);font-weight:600}
.bar{height:6px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}
.bar.seal > i{background:var(--seal)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.hash{font-family:var(--mono);font-size:12px;color:var(--chain);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:9px 11px;font-size:14px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field .hint{font-size:12px;color:var(--muted)}
.note{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:var(--ink-2)}
.divider{height:1px;background:var(--line);margin:4px 0}
.toast-wrap{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--ground);padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:pop .25s ease}
.toast .sealmini{width:20px;height:20px;flex:none}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;background:rgba(9,15,12,.5);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(720px,100%);max-height:min(90vh,860px);overflow:auto;box-shadow:var(--shadow);padding:22px;animation:pop .2s ease}
.modal.narrow{width:min(520px,100%)}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.steps b{color:var(--ink);font-weight:600}
.steps .s{display:flex;align-items:center;gap:6px}
.steps .n{width:20px;height:20px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.steps .s.done .n,.steps .s.cur .n{background:var(--accent);color:#fff}

/* ---------- ledger entries ---------- */
.entry{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}
.entry:last-child{border-bottom:0}
.entry .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.entry .ic.skill{background:var(--accent-soft);color:var(--accent-ink)}
.entry .ic.task{background:var(--info-soft);color:var(--info)}
.entry .ic.claim{background:var(--seal-soft);color:var(--seal)}
.entry .ic.endorse{background:var(--warn-soft);color:var(--warn)}
.entry .ic.vouch{background:var(--seal-soft);color:var(--seal)}
.entry .t{font-weight:600}
.entry .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.entry .proof{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.entry.new{animation:glow 1.6s ease}
@keyframes glow{0%{background:var(--accent-soft)}100%{background:transparent}}
.strength{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em}
.ring .v small{font-size:8.5px;color:var(--muted);font-weight:600;font-family:var(--body);display:block;text-align:center;letter-spacing:.04em}
.opp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.opp .pay{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;text-align:right;line-height:1}
.opp .pay small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);font-weight:500;margin-top:3px}
.opp .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.opp .meta span{display:inline-flex;align-items:center;gap:5px}
.opp .issues{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.logo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;color:#fff;flex:none}
.tasklist{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex-wrap:wrap}
.task .btn{white-space:nowrap}
.task.done{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.task .cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.task.done .cb{background:var(--accent);border-color:var(--accent);color:#fff;text-decoration:none}
.task .btn{margin-left:auto}
.seal{width:120px;height:120px}
.seal-wrap{display:grid;place-items:center;padding:8px}
@keyframes stamp{0%{transform:scale(1.8) rotate(-18deg);opacity:0}60%{transform:scale(.96) rotate(-8deg);opacity:1}80%{transform:scale(1.03) rotate(-8deg)}100%{transform:scale(1) rotate(-8deg)}}
.seal.stamp{animation:stamp .55s cubic-bezier(.2,.8,.2,1) both}
.chainlog{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink-2);line-height:1.7;min-height:118px}
.chainlog .ok{color:var(--good)}
.resume{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px;position:relative;font-size:12.5px;line-height:1.5;color:var(--ink-2);overflow:hidden;min-height:340px}
.resume h4{font-family:var(--display);font-size:18px;color:var(--ink);margin:0}
.resume .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:600}
.resume .claim{padding:5px 8px;border-radius:6px;margin:2px -8px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;border:1px solid transparent}
.resume .claim:hover{background:var(--surface-2)}
.resume .claim.v{border-color:var(--good-soft)}
.resume .claim .st{flex:none;margin-top:2px}
.resume .stampmark{position:absolute;right:16px;top:16px;width:104px;height:104px;opacity:0;pointer-events:none}
.resume.stamped .stampmark{opacity:1;animation:stamp .55s cubic-bezier(.2,.8,.2,1) both}
.resume .foot{margin-top:18px;padding-top:10px;border-top:1px dashed var(--line-2);font-family:var(--mono);font-size:10.5px;color:var(--muted);display:none;justify-content:space-between;gap:10px;flex-wrap:wrap}
.resume.stamped .foot{display:flex}
.qr{width:44px;height:44px;flex:none}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;font-family:var(--mono);font-size:12.5px;overflow:hidden}
.linkbox span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.pool{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pool:last-child{border-bottom:0}
.pool .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.mini{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink-2)}
.funnel{display:grid;gap:8px}
.funnel .f{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.funnel .f .b{height:18px;border-radius:5px;background:var(--accent-soft);position:relative;overflow:hidden}
.funnel .f .b i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.quote{border-left:3px solid var(--line-2);padding:4px 12px;font-size:13.5px;color:var(--ink-2)}
.quote .by{font-size:12px;color:var(--muted);margin-top:4px}
.plan{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.plan.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.plan .price{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.03em}
.plan .price small{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:500}
.plan ul{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.plan .cur-tag{position:absolute;top:-10px;left:14px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.verify-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.verify-head .avatar{width:56px;height:56px;font-size:20px}

function sealSVG(cls='seal',text='VOUCH LEDGER · VERIFIED · ON-CHAIN · ',color='var(--seal)'){
  return `<svg class="${cls}" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="56" fill="none" stroke="${color}" stroke-width="3"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="60" cy="60" r="33" fill="none" stroke="${color}" stroke-width="2"/>
    <text font-family="IBM Plex Mono, monospace" font-size="9.5" font-weight="600" letter-spacing="1.6" fill="${color}"><textPath href="#sealpath">${text}</textPath></text>
    <path d="M46 61l9 9 19-20" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function qrSVG(seedStr){
  let h=0;for(const c of seedStr)h=(h*31+c.charCodeAt(0))>>>0;
  let s='';const n=11;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){h=(h*1103515245+12345)>>>0;const corner=(x<3&&y<3)||(x>n-4&&y<3)||(x<3&&y>n-4);if(corner||((h>>16)&1))s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" fill="currentColor" aria-hidden="true">${s}</svg>`;
}
const initials=(n)=>n.split(' ').map(x=>x[0]).join('').slice(0,2);
function idBadges(v,full=false){
  const b=(on,cls,ch,label)=>`<span class="vb ${on?cls:'off'}" title="${label}${on?' verified':' not verified'}">${ch}</span>`;

  return full?`<span class="row" style="gap:6px;font-size:12px">${['LinkedIn','Work email','Gov ID'].map((l,i)=>`<span class="row" style="gap:4px;color:${[v.li,v.em,v.gov][i]?'var(--ink-2)':'var(--muted)'}">${[b(v.li,'li','in','LinkedIn'),b(v.em,'em','@','Work email'),b(v.gov,'id','ID','Government ID')][i]}${l}</span>`).join('')}</span>`:`<span class="badges">${out}</span>`;
}

function vouchChips(e){const a=[];(e.vouchedBy||[]).forEach(id=>a.push(vchip(id)));if(e.attester)a.push(vchip(e.attester));(e.pendingFrom||[]).forEach(id=>a.push(vchip(id,true)));return a.join('');}
function strengthParts(){const w=e=>e.status==='verified'?e.weight:Math.round(e.weight/2);const sum=k=>S.ledger.filter(e=>k.includes(e.kind)).reduce((a,e)=>a+w(e),0);return [['External vouches',sum(['claim','endorse'])+S.ledger.filter(e=>e.kind==='skill'&&e.attester).reduce((a,e)=>a+w(e),0),'v'],['Company attestations',S.ledger.filter(e=>e.kind==='skill'&&!e.attester).reduce((a,e)=>a+w(e),0),'c'],['Paid tasks',sum(['task']),'t'],['Credentials + stamp',sum(['credential'])+(S.stamped?3:0),'d']];}
function breakdown(){const parts=strengthParts();const tot=Math.max(1,parts.reduce((a,p)=>a+p[1],0));return `<div class="breakdown">${parts.map(p=>`<div class="b"><span class="muted">${p[0]}</span><div class="bar"><i class="${p[2]}" style="width:${p[1]/tot*100}%"></i></div><b class="num" style="text-align:right">${p[1]}</b></div>`).join('')}</div>`;}

function modal(html,opts={}){const r=document.getElementById('modalRoot');r.innerHTML=`<div class="modal-bg" data-close="1"><div class="modal ${opts.narrow?'narrow':''}" role="dialog" aria-modal="true">${html}</div></div>`;r.querySelector('.modal-bg').addEventListener('click',e=>{if(e.target.dataset.close&&!opts.sticky)closeModal();});}

function mintFlow(o){
  const tx='0x'+hex(64);const block=19300000+Math.floor(Math.random()*90000);
  modal(`<div class="stack" style="gap:14px;align-items:center;text-align:center">
    <div class="eyebrow">Writing to your ledger</div>

    <div class="row" id="mintActions" hidden><button class="btn primary" data-mintdone="${o.id}">See it on my ledger ${I.arrow}</button></div>
  </div>`,{sticky:true,narrow:true});
  const log=document.getElementById('chainlog');
  const lines=[`> ${co(o.company).name} confirmed completion`,`> releasing escrow · ${money(o.pay)} to Alex · ${money(Math.round(o.pay/(1-FEE)-o.pay))} platform fee`,`> attest(schema: vouch.task.v2, recipient: ${S.candidate.did.slice(0,22)}…)`,`> tx ${shortHash(tx)} · awaiting inclusion`,`<span class="ok">✓ included in block ${block.toLocaleString()} · 2 confirmations</span>`,`<span class="ok">✓ attestation live · issued by ${co(o.company).name}</span>`];
  lines.forEach((l,i)=>setTimeout(()=>{log.innerHTML+=l+'<br>';if(i===lines.length-1){document.getElementById('sealWrap').innerHTML=sealSVG('seal stamp',`ATTESTED · ${co(o.company).name.toUpperCase()} · `,'var(--accent)');document.getElementById('mintTitle').textContent=`${money(o.pay)} paid. Attestation minted.`;document.getElementById('mintActions').hidden=false;}},400+i*550));
  set(s=>{const so=s.opps.find(x=>x.id===o.id);so.state='done';so.progress=so.steps.map(()=>true);
    const p=s.payouts.find(x=>x.company===o.company&&x.status==='pending');if(p){p.status='paid';p.what=o.title;p.date=today.toISOString();}
    s.ledger.forEach(e=>e.isNew=false);
    s.ledger.push({id:uid(),kind:'task',title:o.title,by:`Completed for ${co(o.company).name} · paid ${money(o.pay)}`,date:today.toISOString(),tx,block,status:'verified',weight:8,payout:o.pay,company:o.company,isNew:true});
    if(o.issues.some(x=>/skill/i.test(x))){s.ledger.push({id:uid(),kind:'skill',title:o.issues.find(x=>/skill/i.test(x)).replace(/^Skill:\s*/i,'').replace(/^\w/,c=>c.toUpperCase()),by:`Attested by ${co(o.company).name} after ${o.type.toLowerCase()}`,date:today.toISOString(),tx:'0x'+hex(64),block:block+1,status:'verified',weight:6,isNew:true});}
    const cp=s.campaigns.find(c=>c.oppId===o.id);if(cp){cp.completed+=1;}
    const t=s.pool.find(x=>x.name===s.candidate.name);if(t){t.att+=1;t.strength=Math.min(100,t.strength+6);}
  });
}

    s.campaigns.unshift({id:uid(),oppId,status:'live',completed:0,seats:d.seats,pay:d.pay,converted:0,score:null,type:d.type,title:d.title||'Untitled campaign',issues,created:today.toISOString(),funnel:[['Invited',d.seats],['Accepted',0],['Started',0],['Completed',0],['Became customers',0]],quotes:[]});
    s.company.seatsUsed=Math.min(s.company.seatsTotal,s.company.seatsUsed+d.seats);
    s.opps.unshift({id:oppId,company:'relay',title:d.title||'Untitled campaign',type:d.type,pay:d.pay,time:/7-day|beta/i.test(d.type)?'7 days':/interview|walkthrough/i.test(d.type)?'45 min':/labeling/i.test(d.type)?'~2 hrs':'20 min',seats:d.seats,total:d.seats,issues,needs:d.needs.split(',').map(x=>x.trim()).filter(Boolean),match:91,desc:d.desc||'New campaign from Relay Analytics.',steps:/interview|walkthrough/i.test(d.type)?['Create account with your Vouch invite link','Complete the task','Complete the interview']:/beta/i.test(d.type)?['Install the app','Use it for 7 days','Submit daily check-ins']:['Book a slot','Complete the session'],state:'open'});
    s.draft=null;
  });
  toast('Campaign is live. It now appears in the candidate marketplace.');
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click',(e)=>{
  const b=e.target.closest('[data-role],[data-view],[data-go],[data-accept],[data-step],[data-filter],[data-copy],[data-stamp],[data-export],[data-askvouch],[data-nudge],[data-mklink],[data-toast],[data-newcamp],[data-camp-step],[data-camp-launch],[data-launch],[data-results],[data-closeresults],[data-invite],[data-plan],[data-verify],[data-checkstamp],[data-mintdone],[data-close],[data-openvouch],[data-signvouch],[data-decline],[data-sendreq]');
  if(!b)return;
  const d=b.dataset;
  if(d.role){closeModal();set(s=>{s.role=d.role;});window.scrollTo({top:0});}
  else if(d.go){closeModal();set(s=>{s.role=d.go;if(d.goview){if(d.go==='verify')s.vView=d.goview;if(d.go==='candidate')s.cView=d.goview;}});window.scrollTo({top:0});}
  else if(d.view){setView(d.view);}
  else if(d.accept){acceptOpp(d.accept);}
  else if(d.step){const [id,i]=d.step.split(':');stepDone(id,Number(i));}
  else if(d.filter){set(s=>{s.oppFilter=d.filter;});}
  else if(d.copy){copyText(d.copy);}
  else if(d.stamp){stampResume();}
  else if(d.export){const blob=JSON.stringify({'@context':'https://vouch.id/ns/v2',id:S.candidate.did,entries:S.ledger.map(e=>({type:e.kind,title:e.title,attester:e.by,tx:e.tx,block:e.block,status:e.status}))},null,2);modal(`<div class="row between"><h2>Export · JSON-LD</h2><button class="btn sm ghost" data-close="1">${I.x}</button></div><p class="small muted" style="margin:6px 0 10px">Portable, readable by any EAS-compatible tool. Host it anywhere.</p><pre class="chainlog" style="white-space:pre-wrap;max-height:50vh;overflow:auto">${blob.replace(/</g,'&lt;')}</pre><div class="row" style="margin-top:12px"><button class="btn primary" data-copy='${blob.replace(/'/g,'&#39;')}'>${I.copy} Copy JSON</button></div>`);}
  else if(d.askvouch){const em=document.getElementById('vouchEmail').value||'maya@cadencehealth.com';toast(`Vouch request sent to ${em}`);}
  else if(d.nudge){toast('Reminder sent to Maya Thompson');}
  else if(d.mklink){const f=document.getElementById('applyFor').value.trim();if(!f){toast('Add the company and role first');return;}set(s=>{s.applyLinks.unshift({id:uid(),for:f,code:f.toLowerCase().replace(/[^a-z]/g,'').slice(0,3)+'-'+hex(3),views:0,created:today.toISOString()});});toast('Link created and copied');}
  else if(d.toast){toast(d.toast);}
  else if(d.newcamp){S.draft=null;newCampaign(1);}
  else if(d.campStep){readDraft();newCampaign(Number(d.campStep));}
  else if(d.campLaunch){launchCampaign();}
  else if(d.launch){set(s=>{const c=s.campaigns.find(x=>x.id===d.launch);c.status='live';c.funnel=[['Invited',c.seats],['Accepted',0],['Started',0],['Completed',0],['Became customers',0]];s.company.seatsUsed=Math.min(s.company.seatsTotal,s.company.seatsUsed+c.seats);const oid=uid();c.oppId=oid;s.opps.unshift({id:oid,company:'relay',title:c.title,type:c.type,pay:c.pay,time:'30 min',seats:c.seats,total:c.seats,issues:c.issues,needs:['Product design','Analytics'],match:89,desc:'Moderated session on the new dashboard builder layout.',steps:['Book a slot','Complete the moderated session'],state:'open'});});toast('Campaign launched. Live in the candidate marketplace.');}
  else if(d.results){set(s=>{s.openCampaign=d.results;s.coView='campaigns';});setTimeout(()=>document.getElementById('results')?.scrollIntoView({behavior:'smooth',block:'start'}),30);}
  else if(d.closeresults){set(s=>{s.openCampaign=null;});}
  else if(d.invite){set(s=>{s.company.invited.push(d.invite);});toast('Invite sent. They see the task, payout and the attestation you will issue.');}
  else if(d.plan){set(s=>{s.company.plan=d.plan;s.company.seatsTotal=PLANS[d.plan].seats;});toast(`Switched to ${PLANS[d.plan].name}. Prorated today.`);}
  else if(d.verify){verifyEntry(d.verify);}
  else if(d.checkstamp){checkStamp();}
  else if(d.mintdone){closeModal();set(s=>{s.cView='ledger';});setTimeout(()=>{const el=document.querySelector('.entry.new');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},60);}
  else if(d.openvouch){vouchModal(d.openvouch);}
  else if(d.signvouch){signVouch(d.signvouch);}
  else if(d.decline){set(s=>{s.requests.find(x=>x.id===d.decline).status='declined';});toast('Recorded privately. The requester sees "could not confirm" and nothing else.');}
  else if(d.sendreq){const dr=S.reqDraft||{claim:'a8',who:'jules',rel:'Former client'};const c=S.ledger.find(e=>e.id===dr.claim);const v=S.vouchers[dr.who];set(s=>{s.requests.unshift({id:uid(),to:dr.who,from:'Alex Rivera',fromHandle:'alex-rivera',fromTitle:'Senior Product Designer',claimId:c.id,claim:c.title,context:'',rel:dr.rel.replace('Former ',''),status:'pending',sent:today.toISOString(),others:(c.vouches||0)?`${c.vouches} vouch already on this claim`:'No other vouches yet'});const e=s.ledger.find(x=>x.id===c.id);if(e&&!(e.vouchedBy||[]).includes(dr.who))e.pendingFrom=[...(e.pendingFrom||[]),dr.who];s.reqDraft=null;});toast(`Request sent to ${v.name}. ${dr.who==='maya'?'Switch to the Voucher view to answer it as Maya.':'They verify identity, then confirm or decline.'}`);}
  else if(d.close){closeModal();}
});
document.addEventListener('change',(e)=>{const t=e.target;if(t.dataset&&t.dataset.rq){S.reqDraft=Object.assign({claim:'a8',who:'jules',rel:'Former client'},S.reqDraft||{});S.reqDraft[t.dataset.rq]=t.value;save();render();}});
document.addEventListener('input',(e)=>{const t=e.target;if(t.dataset&&t.dataset.model){S.model=Object.assign({starter:20,growth:10,scale:2,tasks:14,avgPay:80},S.model||{});S.model[t.dataset.model]=Number(t.value);save();const active=document.activeElement;const id=active&&active.id;render();if(id){const n=document.getElementById(id);if(n)n.focus();}}});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='stampInput')checkStamp();});
document.getElementById('resetBtn').addEventListener('click',()=>{try{localStorage.removeItem(KEY);}catch(_){}const role=S.role;S=seed();S.role=role;save();render();toast('Demo data reset');});

/* hash → initial view */
(function(){const h=location.hash.replace('#','');if(!h)return;if(h==='overview'){S.role='home';return;}const [r,v]=h.split('-');if(RAILS[r]){S.role=r;if(v&&RAILS[r].some(x=>x[0]===v)){if(r==='candidate')S.cView=v;else if(r==='voucher')S.vView2=v;else if(r==='company')S.coView=v;else if(r==='verify')S.vView=v;else S.mView=v;}}})();
render();
</script>
